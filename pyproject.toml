[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nazar-sec"
version = "0.2.0.dev0"
description = "AI-assisted protection for Linux servers, built on CrowdSec"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Nazar contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
geoip = ["geoip2>=4.8"]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "types-PyYAML",
]

[project.scripts]
nazar = "nazar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nazar"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "nazar/prompts"
"examples/config.yaml" = "nazar/data/config.example.yaml"
"deploy/nazar.service" = "nazar/data/nazar.service"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S107", "S311"]
# Names of environment variables that hold secrets, not secrets themselves.
"src/nazar/config.py" = ["S105"]
# SQL schema kept identical to docs/lld/03-store.md, comments included.
"src/nazar/store/migrations.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["nazar"]
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nazar.policy.*", "nazar.models.*", "nazar.config", "nazar.core.*"]
strict = true
