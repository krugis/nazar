# Nazar configuration. Reference: docs/lld/02-config.md
# Secrets are not stored here: they live in /etc/nazar/secrets.env (mode 0600).

mode: dry_run              # dry_run | active

crowdsec:
  lapi_url: http://127.0.0.1:8080
  machine_id: nazar                  # password from $NAZAR_LAPI_PASSWORD
  # cti_api_key_env: NAZAR_CTI_KEY   # optional CrowdSec CTI enrichment

collector:
  interval_seconds: 30

prefilter:
  dedupe_window_seconds: 300
  incident_window_minutes: 30

analyst:
  ollama_url: http://127.0.0.1:11434
  model: hf.co/Nguuma/security-slm-unsloth-1.5b
  timeout_seconds: 60
  temperature: 0.1
  max_calls_per_minute: 10
  prompt_version: triage-v1

policy:
  auto_actions: [ban, notify]
  auto_min_confidence: 0.85
  approval_min_confidence: 0.6
  max_ban_duration: 24h
  max_auto_actions_per_hour: 20
  allowlist_cidrs: []                # your offices, VPN, monitoring, CI, e.g. "198.51.100.0/24"

notifier:
  telegram:
    enabled: false
    bot_token_env: NAZAR_TG_TOKEN
    chat_id: ""
  approval_ttl_minutes: 60
  daily_summary_time: "09:00"
  timezone: UTC

host_context:
  exposed_services: [ssh]

store:
  path: /var/lib/nazar/nazar.db
  retention_days: 90
