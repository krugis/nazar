# Optional systemd drop-in for Ollama when it runs Nazar's triage model on a CPU-only host.
# Install:  sudo mkdir -p /etc/systemd/system/ollama.service.d
#           sudo cp ollama-nazar.conf /etc/systemd/system/ollama.service.d/nazar.conf
#           sudo systemctl daemon-reload && sudo systemctl restart ollama
# See docs/models.md ("Memory").
[Service]
# Recent Ollama versions run llama.cpp's server, which keeps finished prompts' state in RAM
# (default limit 8 GiB). Every Nazar prompt is different, so the cache only grows memory until
# the process is killed. Disable it:
Environment=LLAMA_ARG_CACHE_RAM=0
# One model, one request at a time is enough for Nazar and keeps memory predictable.
Environment=OLLAMA_MAX_LOADED_MODELS=1
Environment=OLLAMA_NUM_PARALLEL=1
# On a shared host, cap Ollama so a model that needs more memory kills only Ollama.
# granite4:micro-h needs about 2.5 GB; leave headroom:
#MemoryMax=2900M
#MemorySwapMax=0
